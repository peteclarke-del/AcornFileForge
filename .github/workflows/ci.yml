name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python, JavaScript and browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application image
        run: docker build --tag acorn-file-forge:ci .

      - name: Run Python tests in the application image
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/source"
          --workdir /source
          acorn-file-forge:ci
          python -m unittest discover -s tests -v

      - name: Run generated-media performance smoke profile
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/source"
          --workdir /source
          acorn-file-forge:ci
          python -m tools.benchmark_media --profile quick --output output/benchmark-ci.json

      - name: Run JavaScript unit tests
        run: node tests/run_js_tests.js

      - name: Start application for browser tests
        run: >-
          docker run --detach --name acorn-file-forge-ci
          --publish 8666:8666
          acorn-file-forge:ci

      - name: Wait for the application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8666/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs acorn-file-forge-ci
          exit 1

      - name: Run browser regressions
        run: npm run test:browser

      - name: Show application log on failure
        if: failure()
        run: docker logs acorn-file-forge-ci

      - name: Stop browser-test application
        if: always()
        run: docker rm --force acorn-file-forge-ci || true

  multiarch:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
          - platform: linux/arm/v7
            tag: armv7
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: acorn-file-forge:matrix-${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Verify native dependencies and complete Python suite
        run: |
          mkdir -p output/release-evidence
          docker run --rm \
            --volume "${{ github.workspace }}:/source" \
            --workdir /source \
            acorn-file-forge:matrix-${{ matrix.tag }} \
            sh -lc 'uname -m; python -c "from capstone import CS_ARCH_ARM, CS_ARCH_M68K, CS_ARCH_MOS65XX, Cs; Cs(CS_ARCH_MOS65XX, 0); print(\"Capstone architecture gate passed\")"; python -m unittest discover -s tests -v' \
            2>&1 | tee output/release-evidence/${{ matrix.tag }}.log

      - name: Verify service health on the target architecture
        run: |
          container="acorn-file-forge-${{ matrix.tag }}"
          docker run --detach --name "$container" --publish 8666:8666 acorn-file-forge:matrix-${{ matrix.tag }}
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8666/api/health | tee output/release-evidence/${{ matrix.tag }}-health.json; then
              docker rm --force "$container"
              exit 0
            fi
            sleep 1
          done
          docker logs "$container" | tee -a output/release-evidence/${{ matrix.tag }}.log
          docker rm --force "$container"
          exit 1

      - name: Retain architecture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ matrix.tag }}
          path: output/release-evidence/
          if-no-files-found: warn
